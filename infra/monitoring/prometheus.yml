global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: campus
    metrics_path: /api/v1/admin/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/campus_admin_token
    static_configs:
      - targets: [host.docker.internal:8000]
